services:
  payload:
    image: node:22-alpine
    ports:
      - '3000:3000'
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
      - next_cache:/home/node/app/.next
    working_dir: /home/node/app/
    command: sh -c "corepack enable && corepack prepare pnpm@10 --activate && pnpm install && NODE_OPTIONS=--no-deprecation pnpm exec next dev --hostname 0.0.0.0 --port 3000"
    depends_on:
      - mongo
      # - postgres
    env_file:
      - .env
    environment:
      # Container must reach Mongo by service name, not 127.0.0.1 from the host .env
      DATABASE_URL: mongodb://mongo/senior-tech-support

  # Ensure your DATABASE_URL uses 'mongo' as the hostname ie. mongodb://mongo/my-db-name
  mongo:
    image: mongo:latest
    ports:
      - '27017:27017'
    command:
      - --storageEngine=wiredTiger
    volumes:
      - data:/data/db
    logging:
      driver: none

  # Uncomment the following to use postgres
  # postgres:
  #   restart: always
  #   image: postgres:latest
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"

volumes:
  data:
  # pgdata:
  node_modules:
  next_cache:
